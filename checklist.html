<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checklist de Documentos - SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="./src/css/checklist.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0a84ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SEE Carpina" />
    <link rel="apple-touch-icon" sizes="180x180" href="./src/images/app/icon-180.png?v=2" />
    <script defer src="./src/js/instalar-app.js"></script>
    <link rel="stylesheet" href="./src/css/portal-refinado.css" />
      <script defer src="./src/js/componentes/carregamento.js"></script>
  </head>

  <body class="portal-refinado">
    <button id="btnTopo">↑</button>
    <div class="loading">
      <see-spinner mensagem="Carregando o sistema" tamanho="grande"></see-spinner>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Checklist de Documentos</h1>
        <div id="docs" class="checkbox-wrapper-14 glass"></div>
      </main>

      <div class="right"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module" src="./src/js/scripts.js"></script>
    <script>
      const caixaDocs = document.querySelector("#docs");
      let documentos = [
        "RG",
        "CPF",
        "PIS/PASEP/NIS",
        "Título de Eleitor",
        "Certidão de Regularidade Eleitoral",
        "CTPS",
        "Registro de Nascimento/Casamento",
        "Comprovante de Residência",
        "Carteira de Reservista",
        "Foto 3x4",
        "Currículo",
        "Comprovante de Grau de Escolaridade",
        "Certidão de Improbidade",
        "Certidão negativa criminal Estadual",
        "Certidão negativa criminal Federal",
        "Conta do Santander",
      ];

      for (let i = 0; i < documentos.length; i++) {
        caixaDocs.insertAdjacentHTML(
          "beforeend",
          `
                <input id="${documentos[i]}" type="checkbox" class="switch" />
                <label for="${documentos[i]}">${documentos[i]}</label>
                <br><br>
            `,
        );
      }
    </script>
  </body>
</html>
