<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checklist de Documentos - SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <style>
      @supports (-webkit-appearance: none) or (-moz-appearance: none) {
        .checkbox-wrapper-14 input[type="checkbox"] {
          --active: var(--clr-primary);
          --active-inner: #fff;
          --focus: 2px rgba(39, 94, 254, 0.3);
          --border: #bbc1e1;
          --border-hover: #275efe;
          --background: #fff;
          --disabled: #f6f8ff;
          --disabled-inner: #e1e6f9;
          -webkit-appearance: none;
          -moz-appearance: none;
          height: 21px;
          outline: none;
          display: inline-block;
          vertical-align: top;
          position: relative;
          margin: 0;
          cursor: pointer;
          border: 1px solid var(--bc, var(--border));
          background: var(--b, var(--background));
          transition:
            background 0.3s,
            border-color 0.3s,
            box-shadow 0.2s;
        }
        .checkbox-wrapper-14 input[type="checkbox"]:after {
          content: "";
          display: block;
          left: 0;
          top: 0;
          position: absolute;
          transition:
            transform var(--d-t, 0.3s) var(--d-t-e, ease),
            opacity var(--d-o, 0.2s);
        }
        .checkbox-wrapper-14 input[type="checkbox"]:checked {
          --b: var(--active);
          --bc: var(--active);
          --d-o: 0.3s;
          --d-t: 0.6s;
          --d-t-e: cubic-bezier(0.2, 0.85, 0.32, 1.2);
        }
        .checkbox-wrapper-14 input[type="checkbox"]:disabled {
          --b: var(--disabled);
          cursor: not-allowed;
          opacity: 0.9;
        }
        .checkbox-wrapper-14 input[type="checkbox"]:disabled:checked {
          --b: var(--disabled-inner);
          --bc: var(--border);
        }
        .checkbox-wrapper-14 input[type="checkbox"]:disabled + label {
          cursor: not-allowed;
        }
        .checkbox-wrapper-14
          input[type="checkbox"]:hover:not(:checked):not(:disabled) {
          --bc: var(--border-hover);
        }
        .checkbox-wrapper-14 input[type="checkbox"]:focus {
          box-shadow: 0 0 0 var(--focus);
        }
        .checkbox-wrapper-14 input[type="checkbox"]:not(.switch) {
          width: 21px;
        }
        .checkbox-wrapper-14 input[type="checkbox"]:not(.switch):after {
          opacity: var(--o, 0);
        }
        .checkbox-wrapper-14 input[type="checkbox"]:not(.switch):checked {
          --o: 1;
        }
        .checkbox-wrapper-14 input[type="checkbox"] + label {
          display: inline-block;
          vertical-align: middle;
          cursor: pointer;
          margin-left: 4px;
        }

        .checkbox-wrapper-14 input[type="checkbox"]:not(.switch) {
          border-radius: 7px;
        }
        .checkbox-wrapper-14 input[type="checkbox"]:not(.switch):after {
          width: 5px;
          height: 9px;
          border: 2px solid var(--active-inner);
          border-top: 0;
          border-left: 0;
          left: 7px;
          top: 4px;
          transform: rotate(var(--r, 20deg));
        }
        .checkbox-wrapper-14 input[type="checkbox"]:not(.switch):checked {
          --r: 43deg;
        }
        .checkbox-wrapper-14 input[type="checkbox"].switch {
          width: 38px;
          border-radius: 11px;
        }
        .checkbox-wrapper-14 input[type="checkbox"].switch:after {
          left: 2px;
          top: 1px;
          border-radius: 50%;
          width: 17px;
          height: 17px;
          background: var(--ab, var(--border));
          transform: translateX(var(--x, 0));
        }
        .checkbox-wrapper-14 input[type="checkbox"].switch:checked {
          --ab: var(--active-inner);
          --x: 17px;
        }
        .checkbox-wrapper-14
          input[type="checkbox"].switch:disabled:not(:checked):after {
          opacity: 0.6;
        }
      }

      .checkbox-wrapper-14 * {
        box-sizing: inherit;
      }
      .checkbox-wrapper-14 *:before,
      .checkbox-wrapper-14 *:after {
        box-sizing: inherit;
      }

      #docs {
        width: 100%;
        padding: var(--card-padding);
        border-radius: var(--card-border-radius);
        box-shadow: var(--box-shadow);
        margin-top: 1rem;
        color: var(--clr-dark);
      }
    </style>
  </head>

  <body>
    <button id="btnTopo">↑</button>
    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Checklist de Documentos</h1>
        <div id="docs" class="checkbox-wrapper-14 glass"></div>
      </main>

      <div class="right"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module" src="./src/js/scripts.js"></script>
    <script>
      const caixaDocs = document.querySelector("#docs");
      let documentos = [
        "RG",
        "CPF",
        "PIS/PASEP/NIS",
        "Título de Eleitor",
        "Certidão de Regularidade Eleitoral",
        "CTPS",
        "Registro de Nascimento/Casamento",
        "Comprovante de Residência",
        "Carteira de Reservista",
        "Foto 3x4",
        "Currículo",
        "Comprovante de Grau de Escolaridade",
        "Certidão de Improbidade",
        "Certidão negativa criminal Estadual",
        "Certidão negativa criminal Federal",
        "Conta do Santander",
      ];

      for (let i = 0; i < documentos.length; i++) {
        caixaDocs.insertAdjacentHTML(
          "beforeend",
          `
                <input id="${documentos[i]}" type="checkbox" class="switch" />
                <label for="${documentos[i]}">${documentos[i]}</label>
                <br><br>
            `,
        );
      }
    </script>
  </body>
</html>
