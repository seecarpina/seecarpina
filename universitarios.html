<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universitários - SEE Carpina</title>

    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>

  <body>
    <button id="btnTopo">↑</button>
    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Cadastro de Universitários</h1>

        <form id="formUniversitario" class="box">
          <input type="hidden" id="idEdicao" />

          <div class="flex g-1">
            <div class="w-100">
              <label>Nome:</label>
              <input type="text" id="nome" required />
            </div>
          </div>

          <div class="flex g-1">
            <div class="w-100">
              <label>Data de nascimento:</label>
              <input type="date" id="dataNascimento" required />
            </div>

            <div class="w-100">
              <label>CPF:</label>
              <input
                type="text"
                id="cpf"
                maxlength="14"
                placeholder="000.000.000-00"
                required
              />
            </div>
          </div>

          <div>
            <label>Nome da mãe:</label>
            <input type="text" id="nomeMae" />
          </div>

          <div class="flex g-1">
            <div class="autocomplete w-100">
              <label>Faculdade:</label>
              <input
                type="text"
                id="faculdade"
                placeholder="Digite para buscar..."
              />
              <ul id="listaFaculdades" class="autocomplete-list"></ul>
            </div>

            <div class="w-100">
              <label>Período:</label>
              <select id="periodo">
                <option value="" disabled selected>Selecione</option>
                <option value="1º">1º</option>
                <option value="2º">2º</option>
                <option value="3º">3º</option>
                <option value="4º">4º</option>
                <option value="5º">5º</option>
                <option value="6º">6º</option>
                <option value="7º">7º</option>
                <option value="8º">8º</option>
                <option value="9º">9º</option>
                <option value="10º">10º</option>
              </select>
            </div>
          </div>

          <div class="flex g-1">
            <div class="w-100 autocomplete">
              <label>Rota:</label>
              <input
                type="text"
                id="rota"
                placeholder="Digite para buscar..."
              />
              <ul id="listaRotas" class="autocomplete-list"></ul>
            </div>

            <div class="w-100">
              <label>Turno</label>
              <select id="turno">
                <option value="" disabled selected>Selecione</option>
                <option value="Manhã">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Noite">Noite</option>
              </select>
            </div>
          </div>

          <label>Foto:</label>
          <div class="flex g-1">
            <input type="file" id="foto" accept="image/*" />
            <button type="button" id="btnCamera" class="btn">
              📷 Usar câmera
            </button>
          </div>
          <img id="previewFoto" style="max-width: 150px; display: none" />

          <div id="botoesCadastro">
            <button class="btn" id="btnCadastrar" type="submit">
              Cadastrar Estudante
            </button>

            <div id="botoesEdicao" style="display: none; gap: 10px">
              <button class="btn" type="submit">Salvar edição</button>
              <button
                type="button"
                class="btn btn-cancelar"
                id="cancelarEdicao"
              >
                Cancelar
              </button>
            </div>
          </div>

          <!-- <div class="flex g-1">
            <button class="btn" type="submit">Salvar</button>

            <button
              type="button"
              id="cancelarEdicao"
              class="btn btn-cancelar"
              style="display: none"
            >
              Cancelar
            </button>
          </div> -->

          <p id="msgEdicao"></p>
        </form>

        <hr />

        <h2>Universitários cadastrados</h2>

        <input
          class="busca"
          type="text"
          id="buscaUniversitario"
          placeholder="🔍 Buscar por nome, CPF, faculdade, período, turno ou rota..."
        />

        <div class="flex justify-center">
          <button id="btnExportarUniversitarios" class="btn-excel">
            📊 Exportar para Excel
          </button>
        </div>

        <table id="tabelaUniversitarios">
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nome</th>
              <th>CPF</th>
              <th>Faculdade</th>
              <th>Período</th>
              <th>Turno</th>
              <th>Rota</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="paginacao" id="paginacaoUniversitarios"></div>
      </main>

      <div class="right"></div>
    </div>

    <!-- Script para gerar o PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Script para gerar o Exel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Scripts padrão -->
    <script type="module" src="./src/js/scripts.js"></script>
    <script type="module" src="./src/js/universitarios.js"></script>
  </body>
</html>
