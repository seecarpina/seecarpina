<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuários - SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="./src/css/usuarios.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0a84ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SEE Carpina" />
    <link rel="apple-touch-icon" sizes="180x180" href="./src/images/app/icon-180.png?v=2" />
    <script defer src="./src/js/instalar-app.js"></script>
    <link rel="stylesheet" href="./src/css/portal-refinado.css" />
      <script defer src="./src/js/componentes/carregamento.js"></script>
  </head>
  <body class="portal-refinado">
    <button id="btnTopo">↑</button>
    <div class="loading">
      <see-spinner mensagem="Carregando o sistema" tamanho="grande"></see-spinner>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Usuários Cadastrados</h1>

        <div class="usuarios-grid">
          <section class="box glass">
            <div class="info-card">
              <span class="material-symbols-outlined">group</span>

              <div>
                <strong>Equipe do sistema</strong><br />
                Consulte os usuários ativos e suas respectivas funções.
              </div>
            </div>
          </section>

          <section class="box glass">
            <div class="usuarios-toolbar">
              <div class="campo-busca-usuarios">
                <span class="material-symbols-outlined">search</span>

                <input
                  type="search"
                  id="buscaUsuarios"
                  placeholder="Buscar por nome, e-mail ou cargo"
                  autocomplete="off"
                />
              </div>

              <span id="contadorUsuarios" class="usuarios-contador"></span>
            </div>

            <div id="listaUsuarios" class="lista-usuarios">
              <div class="usuarios-carregando"><see-spinner mensagem="Carregando usuários..."></see-spinner></div>
            </div>
          </section>
        </div>
      </main>

      <div class="right"></div>
    </div>

    <script type="module" src="./src/js/scripts.js"></script>
  </body>
</html>
