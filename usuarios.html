<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuários - SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="./src/css/usuarios.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <button id="btnTopo">↑</button>
    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Usuários Cadastrados</h1>

        <div class="usuarios-grid">
          <section class="box glass">
            <div class="info-card">
              <span class="material-symbols-outlined">group</span>

              <div>
                <strong>Equipe do sistema</strong><br />
                Consulte os usuários ativos e suas respectivas funções.
              </div>
            </div>
          </section>

          <section class="box glass">
            <div class="usuarios-toolbar">
              <div class="campo-busca-usuarios">
                <span class="material-symbols-outlined">search</span>

                <input
                  type="search"
                  id="buscaUsuarios"
                  placeholder="Buscar por nome, e-mail ou cargo"
                  autocomplete="off"
                />
              </div>

              <span id="contadorUsuarios" class="usuarios-contador"></span>
            </div>

            <div id="listaUsuarios" class="lista-usuarios">
              <div class="usuarios-carregando">Carregando usuários...</div>
            </div>
          </section>
        </div>
      </main>

      <div class="right"></div>
    </div>

    <script type="module" src="./src/js/scripts.js"></script>
  </body>
</html>
