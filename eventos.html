<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos - SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>
  </head>

  <body>
    <button id="btnTopo">↑</button>
    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Cadastrar evento</h1>

        <form id="formEvento" class="box">
          <div class="flex g-1">
            <div class="w-100">
              <label>Título</label>
              <input type="text" id="titulo" required />
            </div>

            <div class="w-100">
              <label>Data</label>
              <input type="date" id="data" required />
            </div>

            <div class="w-100">
              <label>Categoria</label>
              <select id="categoria" required></select>
            </div>
          </div>

          <div class="w-100">
            <textarea id="descricao" placeholder="Descrição"></textarea>
          </div>

          <div id="botoesEvento">
            <button class="btn" id="btnCadastrarEvento" type="submit">
              Salvar evento
            </button>

            <div id="botoesEdicaoEvento" style="display: none; gap: 10px">
              <button type="button" class="btn" id="btnSalvarEdicaoEvento">
                Salvar edição
              </button>
              <button
                type="button"
                class="btn btn-cancelar"
                id="btnCancelarEdicaoEvento"
              >
                Cancelar
              </button>
            </div>
          </div>

          <div id="msgEdicao" style="display: none"></div>
        </form>

        <h2>Eventos</h2>
        <div class="abas-eventos">
          <button class="aba ativa" data-aba="futuros">Eventos futuros</button>
          <button class="aba" data-aba="concluidos">Eventos concluídos</button>
        </div>

        <div class="table-wrapper">
          <table id="tabelaEventos">
            <thead>
              <tr>
                <th>Data</th>
                <th>Título</th>
                <th>Categoria</th>
                <th>Descrição</th>
                <th></th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </main>

      <div class="right"></div>
    </div>

    <script type="module" src="./src/js/scripts.js"></script>
    <script type="module" src="./src/js/eventos.js"></script>
  </body>
</html>
