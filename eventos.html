<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Eventos - SEE Carpina</title>

    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="./src/css/eventos.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.1.0/dist/confetti.min.js"></script>
  </head>

  <body>
    <button id="btnTopo">↑</button>

    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>

    <div id="notificacao"></div>

    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Eventos</h1>

        <div class="eventos-grid">
          <!-- CADASTRO -->
          <section class="box glass">
            <form id="formEvento" class="eventos-form">
              <div class="campo-evento campo-titulo">
                <label for="titulo">Título do evento</label>

                <input
                  type="text"
                  id="titulo"
                  maxlength="180"
                  placeholder="Digite o título do evento"
                  autocomplete="off"
                  required
                />
              </div>

              <div class="campos-evento">
                <div>
                  <label for="data">Data</label>
                  <input type="date" id="data" required />
                </div>

                <div>
                  <label for="categoria">Categoria</label>
                  <select id="categoria" required></select>
                </div>

                <div class="campo-botao">
                  <label for="btnCadastrarEvento" class="label-invisivel">
                    Ação
                  </label>

                  <input
                    type="submit"
                    id="btnCadastrarEvento"
                    class="btn"
                    value="Salvar evento"
                  />
                </div>
              </div>

              <div class="campo-descricao">
                <label for="descricao">Descrição</label>

                <textarea
                  id="descricao"
                  placeholder="Digite uma descrição para o evento"
                ></textarea>
              </div>

              <div id="botoesEvento">
                <div id="botoesEdicaoEvento">
                  <button type="button" class="btn" id="btnSalvarEdicaoEvento">
                    <span class="material-symbols-outlined">save</span>
                    Salvar edição
                  </button>

                  <button
                    type="button"
                    class="btn btn-cancelar"
                    id="btnCancelarEdicaoEvento"
                  >
                    <span class="material-symbols-outlined">close</span>
                    Cancelar
                  </button>
                </div>
              </div>

              <div id="msgEdicao"></div>
            </form>
          </section>

          <section class="box glass">
            <div class="info-card">
              <span class="material-symbols-outlined">event</span>

              <div>
                <strong>Agenda de eventos</strong><br />
                Cadastre e acompanhe os eventos e compromissos no sistema.
              </div>
            </div>
          </section>

          <!-- LISTAGEM -->
          <section class="box glass">
            <div class="eventos-toolbar">
              <div
                class="abas-eventos"
                role="group"
                aria-label="Filtrar eventos"
              >
                <button class="aba ativa" type="button" data-aba="futuros">
                  Eventos futuros
                </button>

                <button class="aba" type="button" data-aba="concluidos">
                  Eventos concluídos
                </button>
              </div>

              <span id="contadorEventos" class="eventos-contador"></span>
            </div>

            <div id="listaEventos" class="lista-eventos">
              <div class="eventos-vazio">Carregando eventos...</div>
            </div>
          </section>
        </div>
      </main>

      <div class="right"></div>
    </div>

    <script type="module" src="./src/js/scripts.js"></script>
    <script type="module" src="./src/js/eventos.js"></script>
  </body>
</html>
