<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <main class="login">
      <form id="formCadastro">
        <div>
          <h1>Cadastro</h1>
        </div>
        <div>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Nome completo"
            required
          />
        </div>
        <div>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="E-mail"
            required
          />
        </div>
        <div>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Senha"
            required
          />
        </div>
        <button class="btn">Cadastrar</button>
        <p>Já tem conta? <a href="login.html">Entrar</a></p>
      </form>
    </main>

    <!-- Firebase Auth + Firestore -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile,
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
      import {
        getFirestore,
        doc,
        setDoc,
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

      // 🔥 Configuração do seu Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyCl69j1qpqKObNlZFSDOaJY5Ob8arFCr3k",
        authDomain: "see-carpina-2a774.firebaseapp.com",
        projectId: "see-carpina-2a774",
      };

      // Inicializa Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // 📋 Formulário de cadastro
      const form = document.getElementById("formCadastro");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nome = document.getElementById("nome").value.trim();
        const email = document.getElementById("email").value.trim();
        const senha = document.getElementById("senha").value.trim();

        try {
          // 1️⃣ Cria usuário no Firebase Auth
          const userCredential = await createUserWithEmailAndPassword(
            auth,
            email,
            senha
          );
          const user = userCredential.user;

          // 2️⃣ Atualiza o perfil com o nome
          await updateProfile(user, { displayName: nome });

          // 3️⃣ Cria documento no Firestore com os dados do usuário
          await setDoc(doc(db, "usuarios", user.uid), {
            nome: nome,
            email: email,
            criadoEm: new Date().toISOString(),
          });

          alert("Usuário cadastrado com sucesso!");
          window.location.href = "index.html";
        } catch (error) {
          alert("Erro ao cadastrar: " + error.message);
        }
      });
    </script>
  </body>
</html>
