<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Configurações - SEE Carpina</title>

    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="./src/css/configuracoes.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>

  <body>
    <button id="btnTopo">↑</button>

    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>

    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Configurações de Usuário</h1>

        <div class="configuracoes-grid">
          <!-- INFORMAÇÃO -->
          <section class="box glass">
            <div class="info-card">
              <span class="material-symbols-outlined"> manage_accounts </span>

              <div>
                <strong>Perfil do usuário</strong><br />
                Atualize seus dados pessoais e preferências do sistema.
              </div>
            </div>
          </section>

          <!-- PERFIL -->
          <section class="box glass">
            <div class="configuracoes-cabecalho">
              <div>
                <h2>Dados do perfil</h2>

                <p>Mantenha suas informações de usuário atualizadas.</p>
              </div>
            </div>

            <form id="formUsuario" class="configuracoes-form">
              <div class="configuracoes-foto">
                <div class="foto-preview-container">
                  <img id="previewFoto" alt="Foto de perfil" />

                  <div id="fotoPlaceholder" class="foto-placeholder">
                    <span class="material-symbols-outlined"> person </span>
                  </div>
                </div>

                <div class="foto-acoes">
                  <label for="userFoto" class="btn btn-upload-foto">
                    <span class="material-symbols-outlined"> add_a_photo </span>

                    Alterar foto
                  </label>

                  <input type="file" id="userFoto" accept="image/*" hidden />
                </div>
              </div>

              <div class="configuracoes-campos">
                <div class="campo-configuracao">
                  <label for="userNome"> Nome </label>

                  <input type="text" id="userNome" autocomplete="name" />
                </div>

                <div class="campo-configuracao">
                  <label for="userCargo"> Cargo </label>

                  <input type="text" id="userCargo" autocomplete="off" />
                </div>

                <div class="campo-configuracao">
                  <label for="userEmail"> Email </label>

                  <input type="email" id="userEmail" readonly />
                </div>
              </div>
            </form>
          </section>

          <!-- APARÊNCIA -->
          <section class="box glass">
            <div class="configuracoes-cabecalho">
              <div>
                <h2>Aparência</h2>

                <p>Escolha suas preferências visuais.</p>
              </div>
            </div>

            <div class="campo-configuracao">
              <label for="temaCores"> Esquema de cores </label>

              <select id="temaCores">
                <option value="">Padrão</option>

                <option value="paleta_1">Paleta 1</option>

                <option value="paleta_2">Paleta 2</option>

                <option value="paleta_3">Paleta 3</option>

                <option value="paleta_4">Paleta 4</option>
              </select>
            </div>
          </section>

          <!-- AÇÕES -->
          <section class="box glass configuracoes-acoes">
            <button type="button" id="btnSalvar" class="btn">
              <span class="material-symbols-outlined"> save </span>

              Salvar alterações
            </button>
          </section>
        </div>
      </main>

      <div class="right"></div>
    </div>

    <script type="module" src="./src/js/scripts.js"></script>

    <script type="module" src="./src/js/configuracoes.js"></script>
  </body>
</html>
