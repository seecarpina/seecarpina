<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadro de Servidores - SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>

  <body>
    <button id="btnTopo">↑</button>
    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>
      <main>
        <h1>Quadro de Servidores</h1>

        <section class="box glass">
          <div class="info-card">
            <span class="material-symbols-outlined">info</span>

            <div>
              <strong>Página em construção</strong><br />
              Não utilizar os quadros aqui gerados como oficiais.
            </div>
          </div>
        </section>

        <div class="box glass">
          <label>Selecione a escola:</label>
          <select id="selectLocal"></select>

          <button id="btnGerarQuadro" class="btn">Gerar PDF</button>
        </div>
      </main>
      <div class="right"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module" src="./src/js/scripts.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script type="module" src="./src/js/quadros.js"></script>
  </body>
</html>
