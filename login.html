<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <main class="login">
      <form action="" class="glass">
        <div>
          <h1>Login</h1>
        </div>
        <div>
          <input
            type="email"
            id="login"
            name="login"
            placeholder="Email"
            required
          />
        </div>
        <div>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Senha"
            required
          />
        </div>
        <button class="btn">Entrar</button>
        <!-- <input type="button" class="btn" value="Entrar" /> -->
      </form>
    </main>

    <script type="module">
      // Importa o Firebase
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

      // Configuração do Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyCl69j1qpqKObNlZFSDOaJY5Ob8arFCr3k",
        authDomain: "see-carpina-2a774.firebaseapp.com",
        projectId: "see-carpina-2a774",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Login
      const form = document.querySelector("form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("login").value;
        const password = document.getElementById("senha").value;

        try {
          await signInWithEmailAndPassword(auth, email, password);
          window.location.href = "./";
        } catch (error) {
          alert("Erro ao logar: " + error.message);
        }
      });

      // Se já estiver logado, redireciona direto
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.href = "./";
        }
      });
    </script>
  </body>
</html>
