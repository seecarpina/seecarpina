<div id="notificacao"></div>
<div class="top">
  <button id="menu_bar">
    <span class="material-symbols-outlined">menu</span>
  </button>

  <div id="themeToggler" class="theme-toggler">
    <span id="iconSystem" class="material-symbols-outlined" data-theme="system">desktop_windows</span>
    <span id="iconLight" class="material-symbols-outlined" data-theme="light">light_mode</span>
    <span id="iconDark" class="material-symbols-outlined" data-theme="dark">dark_mode</span>
  </div>

  <div class="profile">
    <p><b id="nomeUsuario"></b></p>
    <p id="cargoUsuario"></p>
    <small class="text-muted"></small>
  </div>
  <div class="profile-photo">
    <img src="./src/images/profile.webp" alt="" />
  </div>
</div>

<div class="lembretes">
  <h2>Lembretes</h2>
  <div class="item glass">
    <textarea
      name="lembretes"
      id="lembretes"
      placeholder="Exclusivos do usuário"
    ></textarea>
  </div>
</div>

<div class="links-uteis">
  <h2>Links Úteis</h2>
  <div class="box glass" id="linksContainer"></div>

  <button id="btnNovoLink">+ Novo Link</button>
</div>

<div id="modalLink" class="modal">
  <div class="modal-content">
    <span class="fechar">&times;</span>

    <h3>Novo Link</h3>

    <input type="text" id="grupoLink" placeholder="Grupo" class="w-100" />
    <input type="text" id="nomeLink" placeholder="Nome" class="w-100" />
    <input type="text" id="urlLink" placeholder="URL" class="w-100" />

    <button id="salvarLink" class="btn-salvar">Salvar</button>
  </div>
</div>

<div class="calendario">
  <h2>Calendário</h2>
  <div class="box glass">
    <div class="cal-header">
      <button id="prevMes">‹</button>
      <h3 id="mesAno"></h3>
      <button id="nextMes">›</button>
    </div>

    <div class="cal-semana">
      <span>D</span>
      <span>S</span>
      <span>T</span>
      <span>Q</span>
      <span>Q</span>
      <span>S</span>
      <span>S</span>
    </div>

    <div class="cal-dias" id="calDias"></div>
  </div>
  <a href="./eventos" class="btn flex align-center g-1">
    <span class="material-symbols-outlined"> calendar_month </span>
    <span>Eventos</span>
  </a>
</div>
