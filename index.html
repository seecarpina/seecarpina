<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <button id="btnTopo">↑</button>
    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Dashaboard</h1>
        <div class="line-dash">
          <h3 id="boasVindas">Olá!</h3>
          <input type="date" class="date" id="dataHoje" />
        </div>

        <div class="insights">
          <a>
            <div class="timbre" id="abrirTimbres">
              <span class="material-symbols-outlined">docs</span>
              <div class="middle">
                <div class="left">
                  <h3>Timbres SEE</h3>
                  <h1>Download</h1>
                </div>
              </div>
            </div>
          </a>
          <!-- POPUP -->
          <div class="modal" id="modalTimbres">
            <div class="modal-content">
              <span class="fechar">&times;</span>
              <h2>Timbres SEE</h2>

              <div class="opcoes">
                <a
                  href="./src/downloads/SEE CARPINA - Timbre Vertical.docx"
                  download
                >
                  <span class="material-symbols-outlined">download</span>
                  <span>Timbre Vertical</span>
                </a>
                <a
                  href="./src/downloads/SEE CARPINA - Timbre Horizontal.docx"
                  download
                >
                  <span class="material-symbols-outlined">download</span>
                  <span>Timbre Horizontal</span>
                </a>
              </div>
            </div>
          </div>

          <a
            href="http://pmcarpina.tabsassessoria.com.br:8893/sipweb/trabalhador/login/login.xhtml"
            target="_blank"
          >
            <div class="contracheques">
              <span class="material-symbols-outlined">payments</span>
              <div class="middle">
                <div class="left">
                  <h3>Contracheques</h3>
                  <h1>Acessar</h1>
                </div>
              </div>
            </div>
          </a>

          <a href="https://www.carpina.pe.gov.br:2096/" target="_blank">
            <div class="email">
              <span class="material-symbols-outlined">drafts</span>
              <div class="middle">
                <div class="left">
                  <h3>Email</h3>
                  <h1>Acessar</h1>
                </div>
              </div>
            </div>
          </a>
        </div>

        <div class="recent_order">
          <h1>Ordens de Fornecimento Recentes</h1>
          <table>
            <thead>
              <tr>
                <th>Fornecedor</th>
                <th>ARP/Contrato</th>
                <th>Data</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td class="warning">-</td>
                <td class="primary">-</td>
              </tr>

              <tr>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td class="warning">-</td>
                <td class="primary">-</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>

      <div class="right"></div>
    </div>

    <script type="module" src="./src/js/scripts.js"></script>
    <script>
      // POPUP TIMBRES
      const abrirTimbres = document.getElementById("abrirTimbres");
      const modalTimbres = document.getElementById("modalTimbres");
      const fechar = modalTimbres.querySelector(".fechar");
      function abrirFecharmodal(acao) {
        modalTimbres.style.display = acao;
      }

      abrirTimbres.addEventListener("click", () => {
        abrirFecharmodal("flex");
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          abrirFecharmodal("none");
        }
      });

      fechar.addEventListener("click", () => {
        abrirFecharmodal("none");
      });

      modalTimbres.addEventListener("click", (e) => {
        if (e.target === modalTimbres) {
          abrirFecharmodal("none");
        }
      });
    </script>
  </body>
</html>
