<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Controle de Estoque - SEE Carpina</title>

    <link rel="stylesheet" href="./src/css/style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>

  <body>
    <button id="btnTopo">↑</button>

    <div class="loading">
      <svg class="svg-spinner" viewBox="0 0 50 50">
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>

    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Controle de Estoque</h1>
        <!-- CADASTRO -->
        <form id="formMaterial" class="box">
          <div class="flex justify-center align-center g-1">
            <div class="w-100">
              <div class="autocomplete">
                <label>Material:</label>

                <input
                  type="text"
                  id="nomeMaterial"
                  placeholder="Digite o material..."
                  required
                />

                <ul id="autocompleteMaterial" class="autocomplete-list"></ul>
              </div>
            </div>

            <div class="w-100">
              <label>Unidade:</label>

              <select id="unidade">
                <option value="Unidade">Unidade</option>
                <option value="Caixa">Caixa</option>
                <option value="Resma">Resma</option>
                <option value="Pacote">Pacote</option>
                <option value="Fardo">Fardo</option>
                <option value="Kit">Kit</option>
              </select>
            </div>

            <div class="w-100">
              <label>Quantidade:</label>

              <input type="number" id="quantidade" min="1" required />
            </div>
          </div>

          <button class="btn" type="submit">Adicionar ao Estoque</button>
        </form>

        <div class="tabs">
          <button class="tab-btn active" data-tab="estoqueTab">Estoque</button>

          <button class="tab-btn" data-tab="historicoTab">
            Histórico de Romaneios
          </button>
        </div>

        <div id="estoqueTab" class="tab-content active">
          <div class="flex justify-between align-center">
            <h2>Materiais cadastrados</h2>
          </div>

          <div class="flex justify-center g-1">
            <input
              class="busca"
              type="text"
              id="busca"
              placeholder="🔍 Buscar material..."
            />
          </div>
          <center>
            <button class="btn" id="btnNovaEntrega">
              📦 Gerar Nova Entrega
            </button>
          </center>
          <br />
          <table id="tabelaMateriais">
            <thead>
              <tr>
                <th>Material</th>
                <th>Unidade</th>
                <th>Estoque</th>
                <th>Última Mov.</th>
              </tr>
            </thead>

            <tbody></tbody>
          </table>
        </div>

        <div id="historicoTab" class="tab-content">
          <h2>Histórico de Romaneios</h2>

          <div class="flex justify-center g-1">
            <input
              class="busca"
              type="text"
              id="buscaHistorico"
              placeholder="🔍 Buscar histórico..."
            />
          </div>

          <br />

          <table id="tabelaHistorico">
            <thead>
              <tr>
                <th>Data</th>
                <th>Destino</th>
                <th>Itens</th>
                <th>Responsável</th>
                <th>PDF</th>
              </tr>
            </thead>

            <tbody></tbody>
          </table>
        </div>
      </main>

      <div class="right"></div>
    </div>

    <!-- MODAL ENTREGA -->
    <div class="modal" id="modalEntrega">
      <div class="modal-content box">
        <div class="flex justify-between align-center">
          <h2>Nova Entrega</h2>

          <button id="fecharModalEntrega" class="btn-cancelar">✖</button>
        </div>

        <div class="autocomplete">
          <label>Destino:</label>

          <input
            type="text"
            id="destinoEntrega"
            placeholder="Digite o destino..."
          />

          <ul id="autocompleteDestinoEntrega" class="autocomplete-list"></ul>
        </div>

        <hr />

        <div class="flex justify-center align-center g-1">
          <div class="w-100">
            <div class="autocomplete">
              <label>Material:</label>

              <input
                type="text"
                id="materialEntrega"
                placeholder="Digite o material..."
              />

              <ul id="autocompleteEntrega" class="autocomplete-list"></ul>
            </div>
          </div>

          <div class="w-100">
            <label>Quantidade:</label>

            <input type="number" id="quantidadeEntrega" min="1" />
          </div>

          <button class="btn" type="button" id="btnAdicionarItem">
            Adicionar
          </button>
        </div>

        <table id="tabelaItensEntrega">
          <thead>
            <tr>
              <th>Material</th>
              <th>Quantidade</th>
              <th></th>
            </tr>
          </thead>

          <tbody></tbody>
        </table>

        <div class="flex justify-center">
          <button class="btn" id="btnGerarRomaneio">Gerar Romaneio</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/js/scripts.js"></script>
    <script type="module" src="./src/js/estoque.js"></script>
  </body>
</html>
