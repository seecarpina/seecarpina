<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Controle de Estoque - SEE Carpina</title>

    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="./src/css/estoque.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>

  <body>
    <button id="btnTopo">↑</button>

    <div class="loading">
      <svg class="svg-spinner" viewBox="0 0 50 50">
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>

    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Controle de Estoque</h1>

        <div class="estoque-grid">
          <section class="box glass">
            <div class="info-card">
              <span class="material-symbols-outlined">inventory_2</span>

              <div>
                <strong>Gestão de materiais</strong><br />
                Cadastre materiais, acompanhe os saldos e registre entregas.
              </div>
            </div>
          </section>

          <div class="tabs estoque-tabs">
            <button class="tab-btn active" type="button" data-tab="estoqueTab">
              Estoque
            </button>

            <button class="tab-btn" type="button" data-tab="historicoTab">
              Histórico de romaneios
            </button>

            <button class="tab-btn" type="button" data-tab="movimentacoesTab">
              Movimentações
            </button>
          </div>

          <div id="estoqueTab" class="tab-content active">
            <section class="box glass">
              <form id="formMaterial" class="estoque-form">
                <div class="campo-material">
                  <label for="nomeMaterial">Material</label>

                  <div class="autocomplete">
                    <input
                      type="search"
                      id="nomeMaterial"
                      placeholder="Digite o material"
                      autocomplete="off"
                      required
                    />

                    <ul
                      id="autocompleteMaterial"
                      class="autocomplete-list"
                    ></ul>
                  </div>
                </div>

                <div class="campos-material">
                  <div>
                    <label for="categoriaMaterial"> Categoria </label>

                    <select id="categoriaMaterial" required>
                      <option value="">Selecione a categoria</option>
                    </select>
                  </div>

                  <div>
                    <label for="unidade">Unidade</label>

                    <select id="unidade">
                      <option value="Unidade">Unidade</option>
                      <option value="Caixa">Caixa</option>
                      <option value="Resma">Resma</option>
                      <option value="Pacote">Pacote</option>
                      <option value="Fardo">Fardo</option>
                      <option value="Kit">Kit</option>

                      <option value="Kg">Kg</option>
                      <option value="Grama">Grama (g)</option>
                      <option value="Litro">Litro (L)</option>
                      <option value="Mililitro">Mililitro (mL)</option>
                      <option value="Saco">Saco</option>
                      <option value="Lata">Lata</option>
                      <option value="Garrafa">Garrafa</option>
                      <option value="Pote">Pote</option>
                      <option value="Frasco">Frasco</option>
                      <option value="Mão (50 unidades)">
                        Mão (50 unidades)
                      </option>
                      <option value="Metro">Metro</option>
                    </select>
                  </div>

                  <div>
                    <label for="quantidade">Quantidade</label>

                    <input
                      type="search"
                      id="quantidade"
                      inputmode="numeric"
                      autocomplete="off"
                      required
                    />
                  </div>

                  <div class="campo-botao">
                    <label for="btnAdicionarEstoque" class="label-invisivel">
                      Ação
                    </label>

                    <div class="acoes-material">
                      <input
                        type="submit"
                        id="btnAdicionarEstoque"
                        class="btn"
                        value="Adicionar ao estoque"
                      />

                      <button
                        type="button"
                        id="btnCancelarEdicaoMaterial"
                        class="btn btn-cancelar-edicao"
                        hidden
                      >
                        Cancelar
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            </section>

            <section class="box glass">
              <div class="estoque-toolbar">
                <div class="campo-busca-estoque">
                  <span class="material-symbols-outlined">search</span>

                  <input
                    type="search"
                    id="busca"
                    placeholder="Buscar material"
                    autocomplete="off"
                  />

                  <select id="filtroCategoriaEstoque">
                    <option value="">Todas as categorias</option>
                  </select>
                </div>

                <div class="estoque-toolbar-acoes">
                  <span id="contadorMateriais" class="estoque-contador"></span>

                  <button class="btn" id="btnExportarExcel" type="button">
                    <span class="material-symbols-outlined"> table_view </span>

                    Exportar Excel
                  </button>

                  <button class="btn" id="btnNovaEntrega" type="button">
                    <span class="material-symbols-outlined">
                      local_shipping
                    </span>

                    Nova entrega
                  </button>
                </div>
              </div>

              <div id="listaMateriais" class="lista-materiais">
                <div class="estoque-carregando">
                  <svg class="svg-spinner" viewBox="0 0 50 50">
                    <circle
                      class="path"
                      cx="25"
                      cy="25"
                      r="20"
                      fill="none"
                      stroke-width="4"
                    />
                  </svg>
                </div>
              </div>
            </section>
          </div>

          <div id="historicoTab" class="tab-content">
            <section class="box glass">
              <div class="historico-toolbar">
                <div class="campo-busca-estoque">
                  <span class="material-symbols-outlined">search</span>

                  <input
                    type="search"
                    id="buscaHistorico"
                    placeholder="Buscar por destino, data ou responsável"
                    autocomplete="off"
                  />
                </div>

                <span id="contadorRomaneios" class="estoque-contador"></span>
              </div>

              <div id="listaHistorico" class="lista-historico">
                <div class="estoque-carregando">
                  <svg class="svg-spinner" viewBox="0 0 50 50">
                    <circle
                      class="path"
                      cx="25"
                      cy="25"
                      r="20"
                      fill="none"
                      stroke-width="4"
                    />
                  </svg>
                </div>
              </div>
            </section>
          </div>

          <div id="movimentacoesTab" class="tab-content">
            <section class="box glass">
              <div class="historico-toolbar">
                <div class="campo-busca-estoque">
                  <span class="material-symbols-outlined"> search </span>

                  <input
                    type="search"
                    id="buscaMovimentacoes"
                    placeholder="Buscar por material ou responsável"
                    autocomplete="off"
                  />
                </div>

                <div class="estoque-toolbar-acoes">
                  <select id="filtroTipoMovimentacao">
                    <option value="">Todas as movimentações</option>

                    <option value="entrada">Entradas</option>

                    <option value="saida">Saídas</option>
                  </select>

                  <span
                    id="contadorMovimentacoes"
                    class="estoque-contador"
                  ></span>
                </div>
              </div>

              <div id="listaMovimentacoes" class="lista-movimentacoes">
                <div class="estoque-carregando">
                  <svg class="svg-spinner" viewBox="0 0 50 50">
                    <circle
                      class="path"
                      cx="25"
                      cy="25"
                      r="20"
                      fill="none"
                      stroke-width="4"
                    />
                  </svg>
                </div>
              </div>
            </section>
          </div>
        </div>
      </main>

      <div class="right"></div>
    </div>

    <div id="drawerOverlay" class="drawer-overlay"></div>

    <aside id="drawerEntrega" class="drawer-entrega">
      <div class="drawer-cabecalho">
        <div class="drawer-titulo">
          <div class="drawer-titulo-icone">
            <span class="material-symbols-outlined"> shopping_cart </span>
          </div>

          <div>
            <h2>Nova entrega</h2>
            <span> Selecione o destino e adicione os materiais. </span>
          </div>
        </div>

        <button
          id="fecharDrawerEntrega"
          class="drawer-fechar"
          type="button"
          title="Fechar"
          aria-label="Fechar"
        >
          <span class="material-symbols-outlined"> close </span>
        </button>
      </div>

      <div class="drawer-conteudo">
        <div class="autocomplete drawer-campo">
          <label for="destinoEntrega"> Destino </label>

          <input
            type="search"
            id="destinoEntrega"
            placeholder="Digite para buscar o destino"
            autocomplete="off"
          />

          <ul id="autocompleteDestinoEntrega" class="autocomplete-list"></ul>
        </div>

        <div class="drawer-divisor"></div>

        <div class="drawer-adicionar-item">
          <div class="autocomplete drawer-campo">
            <label for="materialEntrega"> Material </label>

            <input
              type="search"
              id="materialEntrega"
              placeholder="Digite para buscar o material"
              autocomplete="off"
            />

            <ul id="autocompleteEntrega" class="autocomplete-list"></ul>
          </div>

          <div class="drawer-quantidade">
            <label for="quantidadeEntrega"> Quantidade </label>

            <input
              type="search"
              id="quantidadeEntrega"
              inputmode="numeric"
              autocomplete="off"
            />
          </div>

          <button class="btn" type="button" id="btnAdicionarItem">
            <span class="material-symbols-outlined"> add </span>

            Adicionar
          </button>
        </div>

        <div class="drawer-itens">
          <div class="drawer-itens-titulo">
            <h3>Itens da entrega</h3>
          </div>

          <div class="table-wrapper">
            <table id="tabelaItensEntrega">
              <thead>
                <tr>
                  <th>Material</th>
                  <th>Quantidade</th>
                  <th></th>
                </tr>
              </thead>

              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="drawer-campo">
          <label for="observacaoEntrega">Observações</label>

          <textarea
            id="observacaoEntrega"
            rows="3"
            maxlength="500"
            placeholder="Informe alguma observação, se necessário."
          ></textarea>
        </div>
      </div>

      <div class="drawer-rodape">
        <button class="btn" id="btnGerarRomaneio" type="button">
          <span class="material-symbols-outlined"> description </span>

          Gerar Romaneio
        </button>
      </div>
    </aside>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module" src="./src/js/scripts.js"></script>
    <script type="module" src="./src/js/estoque.js"></script>
  </body>
</html>
