<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0a84ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SEE Carpina" />
    <link rel="apple-touch-icon" sizes="180x180" href="./src/images/app/icon-180.png?v=2" />
    <script defer src="./src/js/instalar-app.js"></script>
    <link rel="stylesheet" href="./src/css/portal-refinado.css" />
  </head>
  <body class="portal-refinado">
    <button id="btnTopo">↑</button>
    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <div class="recent-orders">
          <center><img src="./src/images/404.gif" style="mix-blend-mode: multiply" /></center>
        </div>
      </main>

      <div class="right"></div>
    </div>

    <script type="module" src="./src/js/scripts.js"></script>
  </body>
</html>
