<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ofícios - SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>

  <body>
    <button id="btnTopo">↑</button>
    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Cadastro de Ofícios</h1>

        <!-- 📋 Formulário -->
        <form id="formOficio" class="box">
          <input type="hidden" id="numero" />
          <input type="hidden" id="responsavel" />
          <input type="hidden" id="data" />

          <div>
            <label for="assunto">Assunto:</label>
            <input type="text" id="assunto" required placeholder="Assunto" />
          </div>

          <div class="flex justify-center align-center g-1">
            <div class="w-100">
              <div class="autocomplete">
                <label for="destino">Destino:</label>
                <input
                  type="text"
                  id="destino"
                  placeholder="Digite para buscar..."
                />
                <ul id="autocompleteDestino" class="autocomplete-list"></ul>
              </div>
            </div>

            <div class="w-100">
              <div class="autocomplete">
                <label for="copia">Cópia:</label>
                <input
                  type="text"
                  id="copia"
                  placeholder="Digite para buscar..."
                />
                <ul id="autocompleteCopia" class="autocomplete-list"></ul>
              </div>
            </div>
          </div>

          <div id="botoesCadastro">
            <button class="btn" id="btnCadastrar" type="submit">
              Cadastrar Ofício
            </button>

            <div id="botoesEdicao" style="display: none; gap: 10px">
              <button type="button" class="btn" id="btnSalvarEdicao">
                Salvar edição
              </button>
              <button
                type="button"
                class="btn btn-cancelar"
                id="btnCancelarEdicao"
              >
                Cancelar
              </button>
            </div>
          </div>

          <p id="msgEdicao"></p>
        </form>

        <hr />

        <h2>Ofícios cadastrados</h2>
        <div class="flex justify-center g-1">
          <input
            class="busca"
            type="text"
            id="busca"
            placeholder="🔍 Buscar por número, assunto, destino ou responsável..."
          />

          <label class="switch">
            <input type="checkbox" id="filtroDisponiveis" />
            <span class="slider">
              <span class="ball"></span>
            </span>
            <span>Ver apenas ofícios disponíveis</span>
          </label>
        </div>

        <table id="tabelaOficios">
          <thead>
            <tr>
              <th>Número</th>
              <th>Assunto</th>
              <th>Data</th>
              <th>Destino</th>
              <th>Cópia</th>
              <th>Responsável</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <!-- 🔢 Paginação -->
        <div class="paginacao" id="paginacao"></div>
      </main>

      <div class="right"></div>
    </div>
    <script type="module" src="./src/js/scripts.js"></script>
  </body>
</html>
