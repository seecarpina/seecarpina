<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ofícios - SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link rel="stylesheet" href="./src/css/oficios.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>

  <body>
    <button id="btnTopo">↑</button>
    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Cadastro de Ofícios</h1>

        <div class="oficios-grid">
          <!-- INFORMAÇÃO -->
          <section class="box glass">
            <div class="info-card">
              <span class="material-symbols-outlined">description</span>

              <div>
                <strong>Controle de ofícios</strong><br />
                Cadastre, consulte, edite e acompanhe os ofícios emitidos pelo
                setor.
              </div>
            </div>
          </section>

          <!-- FORMULÁRIO -->
          <section class="box glass">
            <form id="formOficio" class="oficios-form">
              <input type="hidden" id="numero" />
              <input type="hidden" id="responsavel" />
              <input type="hidden" id="data" />

              <div class="campo-assunto">
                <label for="assunto">Assunto</label>

                <input
                  type="text"
                  id="assunto"
                  required
                  placeholder="Digite o assunto do ofício"
                  autocomplete="off"
                />
              </div>

              <div class="campos-oficio">
                <div class="autocomplete">
                  <label for="destino">Destino</label>

                  <input
                    type="text"
                    id="destino"
                    placeholder="Digite para buscar"
                    autocomplete="off"
                  />

                  <ul id="autocompleteDestino" class="autocomplete-list"></ul>
                </div>

                <div class="autocomplete">
                  <label for="copia">Cópia</label>

                  <input
                    type="text"
                    id="copia"
                    placeholder="Digite para buscar"
                    autocomplete="off"
                  />

                  <ul id="autocompleteCopia" class="autocomplete-list"></ul>
                </div>

                <div class="carpina-digital">
                  <label class="filtro-disponiveis">
                    <input type="checkbox" id="sistemaCarpinaDigital" />

                    <span class="filtro-checkbox">
                      <span class="material-symbols-outlined"> check </span>
                    </span>

                    <span>Sistema Carpina Digital</span>
                  </label>

                  <div id="campoNumeroProcesso" class="campo-numero-processo">
                    <input
                      type="text"
                      id="numeroProcesso"
                      placeholder="Número do processo"
                      autocomplete="off"
                      inputmode="numeric"
                    />
                  </div>
                </div>

                <div id="botoesCadastro" class="campo-botao-oficio">
                  <label class="label-invisivel">Ação</label>

                  <button class="btn" id="btnCadastrar" type="submit">
                    <span class="material-symbols-outlined"> add_circle </span>

                    Cadastrar
                  </button>

                  <div id="botoesEdicao">
                    <button type="button" class="btn" id="btnSalvarEdicao">
                      <span class="material-symbols-outlined"> save </span>

                      Salvar edição
                    </button>

                    <button
                      type="button"
                      class="btn btn-cancelar"
                      id="btnCancelarEdicao"
                    >
                      <span class="material-symbols-outlined"> close </span>

                      Cancelar
                    </button>
                  </div>
                </div>
              </div>

              <p id="msgEdicao"></p>
            </form>
          </section>

          <!-- LISTAGEM -->
          <section class="box glass">
            <div class="oficios-cabecalho">
              <div>
                <h2>Ofícios cadastrados</h2>
                <span id="contadorOficios" class="oficios-contador"></span>
              </div>

              <button id="btnExportarExcel" class="btn-excel" type="button">
                <span class="material-symbols-outlined"> table_view </span>

                Exportar para Excel
              </button>
            </div>

            <div class="oficios-filtros box glass">
              <div class="filtro-ano">
                <label for="filtroAno">Ano</label>
                <select id="filtroAno"></select>
              </div>

              <div class="filtro-periodo">
                <label>Período</label>

                <div class="periodo-campos">
                  <div class="campo-data">
                    <span>De</span>
                    <input
                      type="date"
                      id="filtroDataInicio"
                      aria-label="Data inicial"
                    />
                  </div>

                  <span class="periodo-separador">→</span>

                  <div class="campo-data">
                    <span>Até</span>
                    <input
                      type="date"
                      id="filtroDataFim"
                      aria-label="Data final"
                    />
                  </div>
                </div>
              </div>

              <div class="filtro-busca">
                <label for="busca">Buscar</label>

                <div class="campo-busca-oficios">
                  <span class="material-symbols-outlined">search</span>

                  <input
                    type="search"
                    id="busca"
                    placeholder="Número, assunto, destino ou responsável"
                    autocomplete="off"
                  />
                </div>
              </div>

              <label class="filtro-disponiveis">
                <input type="checkbox" id="filtroDisponiveis" />

                <span class="filtro-checkbox">
                  <span class="material-symbols-outlined">check</span>
                </span>

                <span>Somente disponíveis</span>
              </label>
            </div>

            <div class="table-wrapper tabela-oficios-wrapper">
              <table id="tabelaOficios">
                <thead>
                  <tr>
                    <th>Número</th>
                    <th>Assunto</th>
                    <th>Data</th>
                    <th>Destino</th>
                    <th>Cópia</th>
                    <th>Responsável</th>
                    <th>Ações</th>
                  </tr>
                </thead>

                <tbody></tbody>
              </table>
            </div>

            <div class="paginacao" id="paginacao"></div>
          </section>
        </div>
      </main>

      <div class="right"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script type="module" src="./src/js/scripts.js"></script>
    <script type="module" src="./src/js/oficios.js"></script>
  </body>
</html>
