<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Migrar Ofícios - Firebase</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #333;
        text-align: center;
        padding: 40px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      pre {
        background: #222;
        color: #0f0;
        text-align: left;
        padding: 10px;
        border-radius: 8px;
        max-width: 700px;
        margin: 20px auto;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>🧾 Migração de Ofícios</h1>
    <p>
      Este utilitário vai mover todos os dados válidos da raiz
      <code>/</code> para <code>/oficios</code>.
    </p>
    <button id="migrar">Migrar Dados</button>
    <pre id="saida">Aguardando execução...</pre>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import {
        getDatabase,
        ref,
        get,
        push,
        remove,
        set,
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

      // ⚙️ CONFIGURAÇÃO DO SEU FIREBASE
      const firebaseConfig = {
        apiKey: "AIzaSyCl69j1qpqKObNlZFSDOaJY5Ob8arFCr3k",
        authDomain: "see-carpina-2a774.firebaseapp.com",
        projectId: "see-carpina-2a774",
        databaseURL: "https://see-carpina-2a774-default-rtdb.firebaseio.com",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      const saida = document.getElementById("saida");
      const btn = document.getElementById("migrar");

      btn.addEventListener("click", async () => {
        saida.textContent = "🔍 Lendo dados da raiz...";
        const raizRef = ref(db, "/");
        const snapshot = await get(raizRef);

        if (!snapshot.exists()) {
          saida.textContent = "⚠️ Nenhum dado encontrado na raiz.";
          return;
        }

        const lista = snapshot.val();
        let total = 0,
          migrados = 0;

        if (Array.isArray(lista)) {
          total = lista.length;
          for (const item of lista) {
            if (item && item.numero !== null) {
              await push(ref(db, "oficios"), item);
              migrados++;
            }
          }
        } else {
          // caso os dados não sejam array (outro formato)
          for (const key in lista) {
            const item = lista[key];
            if (item && item.numero !== null) {
              await push(ref(db, "oficios"), item);
              migrados++;
            }
          }
          total = Object.keys(lista).length;
        }

        saida.textContent = `✅ Migração concluída!
      - Total analisado: ${total}
      - Itens migrados: ${migrados}
      - Novos dados salvos em: /oficios
      `;

        // 🔥 (opcional) remover raiz antiga
        try {
          await remove(raizRef);
          saida.textContent += "\n🧹 Dados antigos removidos da raiz.";
        } catch (err) {
          saida.textContent +=
            "\n⚠️ Não foi possível limpar a raiz automaticamente: " +
            err.message;
        }
      });
    </script>
  </body>
</html>
