<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notícias - SEE Carpina</title>
    <link rel="stylesheet" href="./src/css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>

  <style>
    .grid-noticias {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .grid-noticias p {
      color: var(--clr-dark);
      text-align: justify;
    }

    .noticia a {
      display: inline-block;
      margin-top: 0.5rem;
      font-weight: bold;
      color: var(--clr-primary);
    }

    .noticia-img {
      width: 100%;
      height: 180px;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }

    .noticia-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>

  <body>
    <button id="btnTopo">↑</button>
    <div class="loading">
      <svg
        class="svg-spinner"
        viewBox="0 0 50 50"
        role="img"
        aria-label="Carregando"
      >
        <circle
          class="path"
          cx="25"
          cy="25"
          r="20"
          fill="none"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="container">
      <aside id="sidebar"></aside>

      <main>
        <h1>Notícias - Educação no Brasil</h1>
        <div id="listaNoticias" class="grid-noticias"></div>

        <!-- 🔢 Paginação -->
        <div class="paginacao" id="paginacao"></div>
      </main>

      <div class="right"></div>
    </div>
    <script type="module" src="./src/js/scripts.js"></script>
    <script type="module" src="./src/js/noticias.js"></script>
  </body>
</html>
